<!-- CONTACTO -->
<!-- Contacto Sección sobre como nos pueden contactar a nosotros mediante un formulario -->
<section id="contacto">
  <div class="section-header">
    <span class="section-tag">Hablemos</span>
    <h2>Contacto</h2>
    <p>¿Necesitas una infraestructura de red para tu empresa? Cuéntanos tu proyecto y te ayudamos.</p>
  </div>
  <div class="contact-inner">
    <div class="contact-form">
      <div class="form-row">
        <div class="form-group">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" placeholder="Escriba su nombre">
        </div>
        <div class="form-group">
          <label for="empresa">Empresa</label>
          <input type="text" id="empresa" placeholder="Escriba su empresa">
        </div>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Escriba su correo@empresa.com">
      </div>
      <div class="form-group">
        <label for="servicio">Servicio de interes</label>
        <select id="servicio">
          <option value="">Selecciona un servicio</option>
          <option>Diseño de Redes LAN</option>
          <option>Configuración de Servidores</option>
          <option>Seguridad Informática</option>
          <option>Desarrollo Web Corporativo</option>
          <option>Documentación Técnica</option>
        </select>
      </div>
      <div class="form-group">
        <label for="mensaje">Mensaje</label>
        <textarea id="mensaje" placeholder="Describa su proyecto y más detalles"></textarea>
      </div>
      <button class="btn-primary form-submit" onclick="sendForm()">Enviar mensaje</button>
    </div>
  </div>
</section>
